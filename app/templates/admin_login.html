<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito - Admin Leyly Moda Fitness</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #172b4d;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            border: 1px solid #e1e4e8;
        }
        .login-box h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .login-box p {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-login:hover {
            background: #1e293b;
        }
        .erro-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fca5a5;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acesso Administrativo</h2>
        <p>Painel de Controle e Pedidos</p>

        {% if erro %}
        <div class="erro-msg">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" name="email" required placeholder="E-mail do administrador">
            </div>
            <div class="form-group">
                <label>Senha de Segurança</label>
                <input type="password" name="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">ACESSAR PAINEL</button>
        </form>
        <a href="/" class="back-link">← Voltar para a Loja Pública</a>
    </div>
</body>
</html>
